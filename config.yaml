app:
  name: "Neptun"
  version: "1.0.0"
  environment: "production"

api:
  baseUrl: "https://prime.speedwagon.uz"
  timeout: 30000
  retryAttempts: 3

auth:
  tokenExpiryTime: 3600
  refreshTokenExpiryTime: 86400

features:
  enableFileUpload: true
  enableCategories: true
  maxFileSize: 10485760 # 10MB in bytes

logging:
  level: "info" # debug, info, warn, error
  enableConsole: true

adobe:
  # Adobe PDF Embed API Client ID
  # Get your client ID from: https://developer.adobe.com/document-services/apis/pdf-embed-api/
  clientId: "09dae9aa8b8749738990ffe012751ebc"
  defaultViewMode: "FIT_WIDTH" # FIT_PAGE, FIT_WIDTH, TWO_COLUMN, TWO_COLUMN_FIT_PAGE
